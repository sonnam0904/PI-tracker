name: Release

on:
  push:
    branches: [master]

# Cần quyền ghi để semantic-release tạo tag/release và commit changelog.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 1) Phân tích commit → tính version → tạo git tag + GitHub Release + changelog.
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2) Chỉ chạy khi có release mới: build binary từng OS trên runner tương ứng,
  #    đóng gói và đính kèm vào release vừa tạo.
  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            wails_flags: -tags webkit2_41
            asset: task-manager-linux-amd64.tar.gz
          - os: windows-latest
            platform: windows/amd64
            wails_flags: ""
            asset: task-manager-windows-amd64.zip
          - os: macos-latest
            platform: darwin/universal
            wails_flags: ""
            asset: task-manager-macos-universal.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        # Nhúng version (từ semantic-release) vào biến main.Version để updater
        # biết phiên bản đang chạy mà so với GitHub Releases.
        run: wails build -platform ${{ matrix.platform }} ${{ matrix.wails_flags }} -ldflags "-X main.Version=${{ needs.release.outputs.version }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp .env.example build/bin/
          tar -C build/bin -czf "${{ matrix.asset }}" task-manager .env.example

      # Đóng gói cài đặt desktop: .deb (Debian/Ubuntu) + .rpm (Fedora) qua nfpm
      # — cài đặt binary vào /usr/bin, kèm desktop entry + icon (hiện trong menu).
      - name: Package Linux installers (.deb & .rpm)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.release.outputs.version }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          mkdir -p dist
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
          ls -1 dist
          gh release upload "${{ needs.release.outputs.tag }}" dist/*.deb dist/*.rpm --clobber

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # Wails đặt tên .app theo "name" trong wails.json, không chắc trùng
          # outputfilename — dò bundle thực tế thay vì hardcode.
          app=$(ls -d build/bin/*.app | head -n1)
          echo "Đóng gói: $app + .env.example"
          # Gom bundle + .env.example vào thư mục tạm rồi nén (không keepParent
          # để nội dung nằm ở gốc zip: MyApp.app + .env.example).
          stage=build/pkg
          mkdir -p "$stage"
          cp -R "$app" "$stage/"
          cp .env.example "$stage/"
          ditto -c -k "$stage" "${{ matrix.asset }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item .env.example build/bin/
          Compress-Archive -Path build/bin/task-manager.exe, build/bin/.env.example -DestinationPath "${{ matrix.asset }}"

      - name: Upload asset to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ matrix.asset }}" --clobber
