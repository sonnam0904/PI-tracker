name: Release

on:
  push:
    branches: [master]

# Cần quyền ghi để semantic-release tạo tag/release và commit changelog.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 1) Phân tích commit → tính version → tạo git tag + GitHub Release + changelog.
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2) Chỉ chạy khi có release mới: build binary từng OS trên runner tương ứng,
  #    đóng gói và đính kèm vào release vừa tạo.
  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            wails_flags: -tags webkit2_41
            asset: task-manager-linux-amd64.tar.gz
          - os: windows-latest
            platform: windows/amd64
            wails_flags: ""
            asset: task-manager-windows-amd64.zip
          - os: macos-latest
            platform: darwin/universal
            wails_flags: ""
            asset: task-manager-macos-universal.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        # Nhúng version (từ semantic-release) vào biến main.Version để updater
        # biết phiên bản đang chạy mà so với GitHub Releases.
        run: wails build -platform ${{ matrix.platform }} ${{ matrix.wails_flags }} -ldflags "-X main.Version=${{ needs.release.outputs.version }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C build/bin -czf "${{ matrix.asset }}" task-manager

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # Wails đặt tên .app theo "name" trong wails.json, không chắc trùng
          # outputfilename — dò bundle thực tế thay vì hardcode.
          app=$(ls -d build/bin/*.app | head -n1)
          echo "Đóng gói: $app"
          ditto -c -k --keepParent "$app" "${{ matrix.asset }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/task-manager.exe -DestinationPath "${{ matrix.asset }}"

      - name: Upload asset to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ matrix.asset }}" --clobber
